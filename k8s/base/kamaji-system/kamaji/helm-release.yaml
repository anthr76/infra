---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kamaji
  namespace: kamaji-system
spec:
  interval: 10m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: charts/kamaji
      sourceRef:
        kind: GitRepository
        name: clastix
        namespace: flux-system
  values:
    image:
      # Must match the chart ref in
      # flux-system/helm-chart-repositories/clastix.yaml;
      # Renovate groups both (see .renovate/groups.json5).
      # renovate: datasource=docker depName=clastix/kamaji
      tag: 26.11.5-edge
    # The chart default limit of 100Mi gets the controller OOM-killed
    # (51 restarts in 15 days).
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
    # Datastore etcd runs on civo-volume (network block storage) whose fsync
    # latency is too high for etcd's default 100ms/1s heartbeat/election timing,
    # causing leader-election churn (raft term 227) and apiserver "etcdserver:
    # request timed out" that cascades into qgr1 tenant-cluster instability.
    # Stopgap: widen the timing to tolerate slow-disk stalls. Durable fix is to
    # move etcd off civo-volume onto low-latency local storage.
    kamaji-etcd:
      image:
        # renovate: datasource=docker depName=quay.io/coreos/etcd
        tag: v3.6.13
      extraArgs:
        - --heartbeat-interval=500
        - --election-timeout=5000
      # Without requests etcd was BestEffort: first to be evicted under node
      # memory pressure. Observed 130-555Mi (the leader is the largest).
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      # One member per node, so a node loss never costs etcd its quorum.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              application: kamaji-etcd
