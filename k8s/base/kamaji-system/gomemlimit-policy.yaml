---
# Kamaji has no way to set env on control-plane containers, so inject
# GOMEMLIMIT into every container of every tenant control-plane pod at
# creation. It is set to 90% of the container's own memory limit, so the Go GC
# works to stay under the limit and the remaining 10% covers non-heap memory
# (goroutine stacks, mmaps, cgo) instead of the container getting OOMKilled.
# Containers without a memory limit are left alone.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: kamaji-gomemlimit
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    objectSelector:
      matchLabels:
        kamaji.clastix.io/component: deployment
  mutations:
    # JSONPatch rather than ApplyConfiguration: env is a list keyed by name,
    # and JSONPatch lets the expression add to it per container index.
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          lists.range(size(object.spec.containers))
            .filter(i,
              has(object.spec.containers[i].resources) &&
              has(object.spec.containers[i].resources.limits) &&
              "memory" in object.spec.containers[i].resources.limits &&
              (!has(object.spec.containers[i].env) ||
                !object.spec.containers[i].env.exists(e, e.name == "GOMEMLIMIT")))
            .map(i, [dyn(i), dyn({
              "name": dyn("GOMEMLIMIT"),
              "value": dyn(string(int(
                quantity(object.spec.containers[i].resources.limits["memory"]).asApproximateFloat() * 0.9)))
            })])
            .map(p, has(object.spec.containers[p[0]].env) ?
              JSONPatch{op: "add", path: "/spec/containers/" + string(p[0]) + "/env/-", value: p[1]} :
              JSONPatch{op: "add", path: "/spec/containers/" + string(p[0]) + "/env", value: [p[1]]})
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: kamaji-gomemlimit
spec:
  policyName: kamaji-gomemlimit
