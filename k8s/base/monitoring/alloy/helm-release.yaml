---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
  values:
    controller:
      type: daemonset
    alloy:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      # Reads container logs from the node's /var/log/pods. Tailing through the
      # Kubernetes API proxied every log stream via the (Kamaji-hosted) API server
      # and pushed it into OOM. Discovery is still node-local (the chart sets
      # HOSTNAME to spec.nodeName).
      mounts:
        varlog: true
      # Syslog listener (network devices); exposed on 10.45.0.5 by the
      # alloy-syslog LoadBalancer in monitoring/network-o11y.
      extraPorts:
        - name: syslog-udp
          port: 1514
          targetPort: 1514
          protocol: UDP
      configMap:
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
              separator     = ";"
              regex         = "([^;]+);.*|;([^;]+)"
              replacement   = "$1$2"
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          loki.process "pods" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }

          // Network device syslog (MikroTik switches send BSD/RFC 3164).
          loki.source.syslog "network" {
            listener {
              address       = "0.0.0.0:1514"
              protocol      = "udp"
              syslog_format = "rfc3164"
              labels        = { job = "syslog" }
            }
            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.write.default.receiver]
          }

          loki.relabel "syslog" {
            forward_to = []

            rule {
              source_labels = ["__syslog_message_hostname"]
              target_label  = "host"
            }
            rule {
              source_labels = ["__syslog_message_severity"]
              target_label  = "level"
            }
            rule {
              source_labels = ["__syslog_message_facility"]
              target_label  = "facility"
            }
            rule {
              source_labels = ["__syslog_message_app_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__syslog_connection_ip_address"]
              target_label  = "source_ip"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
    serviceMonitor:
      enabled: true
