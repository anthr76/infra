---
# Telegram bot token for Alertmanager (bot "Robot Kutara", Home Ops group).
# Mounted at /etc/alertmanager/secrets/alertmanager-telegram/token via
# alertmanagerSpec.secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: telegramBotToken
