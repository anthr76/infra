---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.11.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-oci
        namespace: flux-system
  values:
    # The Prometheus Operator CRDs already exist on the cluster (applied out of band
    # with plain kubectl, so helm does not own them). The upgrade job server-side
    # applies the chart's CRDs with --force-conflicts so they match the operator
    # version instead of staying frozen at whatever was first applied.
    crds:
      enabled: true
      upgradeJob:
        enabled: true

    # Alertmanager runs with the chart's default config (everything routed to a null
    # receiver). It is here so Prometheus has an Alertmanager to talk to (otherwise
    # PrometheusNotConnectedToAlertmanagers fires forever); add receivers, and the
    # secret they need, once there is somewhere to send alerts.
    # Three replicas form a gossip cluster; Prometheus sends every alert to all of them
    # and they dedupe notifications between themselves.
    alertmanager:
      enabled: true
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      alertmanagerSpec:
        replicas: 3
        retention: 120h
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: fast-ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi

    # Two independent, identical Prometheus replicas (plain HA, no Thanos, no sharding).
    # Each scrapes everything and evaluates rules itself, with its own PVC. The
    # operator adds the `prometheus_replica` external label, which Alertmanager
    # uses to dedupe the duplicate alerts. Grafana queries the regular Service, which
    # balances across both.
    prometheus:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      prometheusSpec:
        replicas: 2
        shards: 1
        replicaExternalLabelName: prometheus_replica
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        retention: 14d
        retentionSize: 45GiB
        # Pick up every ServiceMonitor/PodMonitor/Probe/PrometheusRule in the cluster
        # (cilium, external-dns, cloudnative-pg, metrics-server, ...), not only the
        # ones labelled with this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: fast-ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi

    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi

    # Grafana is its own HelmRelease (../grafana). Still render the bundled
    # dashboards and the Prometheus/Alertmanager datasources as ConfigMaps for
    # its sidecars to pick up.
    grafana:
      enabled: false
      forceDeployDashboards: true
      forceDeployDatasources: true
      defaultDashboardsTimezone: America/New_York

    # The control plane is hosted off-cluster (Kamaji on civo-mgmt-0), so these
    # components have no in-cluster endpoints to scrape. Cilium replaces kube-proxy.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    # Matching alert/recording rules would only ever report the targets as absent.
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
