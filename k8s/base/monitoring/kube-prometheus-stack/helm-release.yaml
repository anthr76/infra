---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 94.1.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-oci
        namespace: flux-system
  values:
    # The Prometheus Operator CRDs already exist on the cluster (applied out of band
    # with plain kubectl, so helm does not own them). The upgrade job server-side
    # applies the chart's CRDs with --force-conflicts so they match the operator
    # version instead of staying frozen at whatever was first applied.
    crds:
      enabled: true
      upgradeJob:
        enabled: true

    # Alertmanager sends to Telegram: Home Ops group, "Alerts" topic, via the
    # existing bot (token from Bitwarden `telegramBotToken`, ./external-secret.yaml).
    # Rules are evaluated by Thanos Ruler, which sends to all three replicas; the
    # replicas form a gossip cluster and dedupe notifications between themselves.
    # Messages are plain text on purpose: with parse_mode HTML, any '<' or '>' in
    # an alert's annotations makes Telegram reject the whole message.
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: [namespace, alertname]
          - source_matchers: ['severity = "warning"']
            target_matchers: ['severity = "info"']
            equal: [namespace, alertname]
          - source_matchers: ['alertname = "InfoInhibitor"']
            target_matchers: ['severity = "info"']
            equal: [namespace]
          - target_matchers: ['alertname = "InfoInhibitor"']
        route:
          receiver: telegram
          group_by: [alertname, namespace, device]
          group_wait: 30s
          group_interval: 5m
          # Re-notify a still-firing alert weekly. Must stay below alertmanagerSpec.retention
          # (the notification log), or the log expires and it re-sends early.
          repeat_interval: 168h
          routes:
            # Heartbeat / helper alerts that are meant to be silenced.
            - receiver: "null"
              matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
                chat_id: -1002927506291
                message_thread_id: 18666
                parse_mode: ""
                send_resolved: true
                message: '{{ template "telegram.message" . }}'
        templates:
          - /etc/alertmanager/config/*.tmpl
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.icon" -}}
          {{ if eq .Status "resolved" }}✅{{ else if eq .CommonLabels.severity "critical" }}🚨{{ else if eq .CommonLabels.severity "warning" }}⚠️{{ else }}ℹ️{{ end }}
          {{- end }}

          {{ define "telegram.message" -}}
          {{ template "telegram.icon" . }} {{ if eq .Status "resolved" }}RESOLVED{{ else }}FIRING{{ end }} · {{ .CommonLabels.alertname }}
          {{- if gt (len .Alerts) 1 }} ×{{ len .Alerts }}{{ end }}
          {{- range .Alerts }}
          • {{ with .Annotations.summary }}{{ . }}{{ else }}{{ with .Annotations.description }}{{ . }}{{ else }}{{ .Labels.alertname }}{{ end }}{{ end }}
          {{- if or .Labels.device .Labels.name .Labels.namespace .Labels.pod .Labels.node }}
             {{ with .Labels.device }}device={{ . }} {{ end }}{{ with .Labels.name }}port={{ . }} {{ end }}{{ with .Labels.namespace }}ns={{ . }} {{ end }}{{ with .Labels.pod }}pod={{ . }} {{ end }}{{ with .Labels.node }}node={{ . }}{{ end }}
          {{- end }}
             since {{ .StartsAt.UTC.Format "Jan 2 15:04 UTC" }}{{ if eq .Status "resolved" }} → {{ .EndsAt.UTC.Format "15:04 UTC" }}{{ end }}
          {{- with .Annotations.runbook_url }}
             runbook: {{ . }}
          {{- end }}
          {{- end }}
          {{- end }}
      # The chart renders this map as-is with a minAvailable: 1 default, so setting
      # maxUnavailable as well is rejected. 3 Alertmanager replicas: allow one down.
      podDisruptionBudget:
        enabled: true
        minAvailable: 2
      alertmanagerSpec:
        replicas: 3
        # Silences + notification log; keep above route.repeat_interval (168h).
        retention: 192h
        # Mounted at /etc/alertmanager/secrets/<name>/.
        secrets:
          - alertmanager-telegram
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: fast-ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi

    # Sharded, replicated Prometheus behind Thanos: 2 shards x 2 replicas = 4 pods.
    # Each shard scrapes a hash-slice of the targets; the two replicas within a shard
    # scrape the same slice and dedupe on `prometheus_replica`. Queries go through
    # Thanos Query (../thanos-query), which fans out to every sidecar and merges the
    # shards. Because a shard only sees part of the data, Prometheus itself evaluates
    # no rules: Thanos Ruler (below) does, against Thanos Query.
    prometheus:
      # The chart renders this map as-is with a minAvailable: 1 default, so setting
      # maxUnavailable as well is rejected. 4 Prometheus pods (2 shards x 2 replicas): allow one down.
      podDisruptionBudget:
        enabled: true
        minAvailable: 3
      # Headless gRPC Service covering every sidecar (all shards and replicas), used
      # by Thanos Query for discovery.
      thanosService:
        enabled: true
      thanosServiceMonitor:
        enabled: true
      prometheusSpec:
        replicas: 2
        shards: 2
        replicaExternalLabelName: prometheus_replica
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        # Each pod holds roughly half of the data.
        retention: 14d
        retentionSize: 25GiB
        # Pick up every ServiceMonitor/PodMonitor/Probe in the cluster (cilium,
        # external-dns, cloudnative-pg, metrics-server, ...), not only the ones
        # labelled with this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # Select no PrometheusRules (nothing carries this label); Thanos Ruler owns them.
        ruleSelectorNilUsesHelmValues: false
        ruleSelector:
          matchLabels:
            prometheus.kutara.io/evaluate-rules: "true"
        thanos:
          # renovate: datasource=docker depName=quay.io/thanos/thanos
          image: quay.io/thanos/thanos:v0.42.5
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: fast-ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi

    # Evaluates every PrometheusRule in the cluster (including the chart's default
    # rules) against Thanos Query, so rules see all shards. Replicas dedupe on
    # `thanos_ruler_replica`; alerts go to every Alertmanager. Rule results are
    # served to Thanos Query over the ruler's Store API.
    thanosRuler:
      enabled: true
      # The chart renders this map as-is with a minAvailable: 1 default, so setting
      # maxUnavailable as well is rejected. 2 Thanos Ruler replicas: allow one down.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      thanosRulerSpec:
        replicas: 2
        podAntiAffinity: soft
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}
        ruleSelector: {}
        retention: 24h
        queryEndpoints:
          - http://thanos-query.monitoring.svc.cluster.local:9090
        alertmanagersConfig:
          secret:
            alertmanagers:
              - api_version: v2
                scheme: http
                timeout: 10s
                static_configs:
                  - dnssrv+_http-web._tcp.alertmanager-operated.monitoring.svc.cluster.local
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: fast-ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi

    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi

    # Grafana is its own HelmRelease (../grafana). Still render the bundled
    # dashboards and the Prometheus/Alertmanager datasources as ConfigMaps for
    # its sidecars to pick up.
    grafana:
      enabled: false
      forceDeployDashboards: true
      forceDeployDatasources: true
      sidecar:
        datasources:
          # Query through Thanos Query so Grafana sees every shard, deduplicated.
          url: http://thanos-query.monitoring.svc.cluster.local:9090
      defaultDashboardsTimezone: America/New_York

    # The control plane is hosted off-cluster (Kamaji on civo-mgmt-0), so these
    # components have no in-cluster endpoints to scrape. Cilium replaces kube-proxy.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    # Matching alert/recording rules would only ever report the targets as absent.
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      # Flux resource state (gotk_resource_info) for the Flux dashboards and alerts,
      # from https://github.com/fluxcd/flux2-monitoring-example.
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
              - image.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
              - imagerepositories
              - imagepolicies
              - imageupdateautomations
            verbs: [ "list", "watch" ]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, lastAppliedRevision ]
                      source_name: [ spec, sourceRef, name ]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, history, "0", chartVersion ]
                      chart_name: [ status, history, "0", chartName ]
                      chart_app_version: [ status, history, "0", appVersion ]
                      chart_ref_name: [ spec, chartRef, name ]
                      chart_source_name: [ spec, chart, spec, sourceRef, name ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Bucket resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      endpoint: [ spec, endpoint ]
                      bucket_name: [ spec, bucketName ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      chart_name: [ spec, chart ]
                      chart_version: [ spec, version ]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      revision: [ status, artifact, revision ]
                      url: [ spec, url ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Alert
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Alert resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      suspended: [ spec, suspend ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Provider
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Provider resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      suspended: [ spec, suspend ]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Receiver resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      webhook_path: [ status, webhookPath ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImageRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      image: [ spec, image ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImagePolicy
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImagePolicy resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      source_name: [ spec, imageRepositoryRef, name ]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1
                  kind: ImageUpdateAutomation
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageUpdateAutomation resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [ metadata, name ]
                    labelsFromPath:
                      exported_namespace: [ metadata, namespace ]
                      ready: [ status, conditions, "[type=Ready]", status ]
                      suspended: [ spec, suspend ]
                      source_name: [ spec, sourceRef, name ]

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
