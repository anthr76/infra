---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.11.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-oci
        namespace: flux-system
  values:
    # The Prometheus Operator CRDs already exist on the cluster (applied out of band
    # with plain kubectl, so helm does not own them). The upgrade job server-side
    # applies the chart's CRDs with --force-conflicts so they match the operator
    # version instead of staying frozen at whatever was first applied.
    crds:
      enabled: true
      upgradeJob:
        enabled: true

    # Alertmanager runs with the chart's default config (everything routed to a null
    # receiver). It is here so Prometheus has an Alertmanager to talk to (otherwise
    # PrometheusNotConnectedToAlertmanagers fires forever); add receivers, and the
    # secret they need, once there is somewhere to send alerts.
    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 120h
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: fast-ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi

    prometheus:
      prometheusSpec:
        retention: 14d
        retentionSize: 45GiB
        # Pick up every ServiceMonitor/PodMonitor/Probe/PrometheusRule in the cluster
        # (cilium, external-dns, cloudnative-pg, metrics-server, ...), not only the
        # ones labelled with this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 3Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: fast-ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi

    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi

    grafana:
      enabled: true
      # No adminPassword set: the chart generates a random one and keeps it in the
      # kube-prometheus-stack-grafana secret.
      defaultDashboardsTimezone: America/New_York
      sidecar:
        dashboards:
          # Pick up dashboards shipped as labelled ConfigMaps from any namespace.
          searchNamespace: ALL
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          jsonData:
            maxLines: 5000
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 512Mi
      route:
        main:
          enabled: true
          hostnames:
            - grafana.qgr1.rabbito.tech
          parentRefs:
            - name: cilium-internal
              namespace: kube-system

    # The control plane is hosted off-cluster (Kamaji on civo-mgmt-0), so these
    # components have no in-cluster endpoints to scrape. Cilium replaces kube-proxy.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    # Matching alert/recording rules would only ever report the targets as absent.
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
