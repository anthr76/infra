  ---
# SNMP exporter for qgr1 switch interface traffic (IF-MIB: per-port octets,
# errors, discards, oper status, speed). Uses the exporter's built-in
# `if_mib` module and `public_v2` auth, so no generator config is needed.
#
# Switch side (RouterOS, set Nov 2026): `/snmp set enabled=yes` and the
# `public` community restricted to read-only from the cluster node network
# (192.168.8.0/24) and pod network (10.36.0.0/16).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-snmp-exporter
      version: 9.21.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-oci
        namespace: flux-system
  values:
    fullnameOverride: snmp-exporter
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      # The kube-prometheus-stack Prometheus selects all ServiceMonitors.
      selector: {}
      interval: 60s
      # sw-core-1 has ~40 interfaces; a full IF-MIB walk takes a few seconds.
      scrapeTimeout: 30s
      module:
        - if_mib
      auth:
        - public_v2
      params:
        - name: sw-core-1
          target: 10.20.99.20
          additionalMetricsRelabels:
            instance: 10.20.99.20
            device: sw-core-1
        - name: sw-core-2
          target: 10.20.99.10
          additionalMetricsRelabels:
            instance: 10.20.99.10
            device: sw-core-2
        - name: sw-2
          target: 10.20.99.15
          additionalMetricsRelabels:
            instance: 10.20.99.15
            device: sw-2
        - name: sw-access-1
          target: 10.20.99.30
          additionalMetricsRelabels:
            instance: 10.20.99.30
            device: sw-access-1
