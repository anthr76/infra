---
# Blackbox exporter for qgr1 network observability: reachability of the site's
# network gear and the DNS/inform paths that broke after the Nov 2026 outages.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 12.0.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-oci
        namespace: flux-system
  values:
    fullnameOverride: blackbox-exporter
    # Unprivileged ICMP via ping_group_range keeps all capabilities dropped.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      sysctls:
        - name: net.ipv4.ping_group_range
          value: "0 2147483647"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    config:
      modules:
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        # The kubelets reach the API server by this tailnet name through fw1's
        # BIND. A cached NXDOMAIN here took every node NotReady on 2026-11-27.
        dns_qgr1_apiserver:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            transport_protocol: udp
            query_name: qgr1-k8s.mole-bowfin.ts.net
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_not_matches_regexp:
                - ".*\t100\\.94\\.68\\.123$"
        # UniFi devices find the controller by this name. A stale external-dns
        # record (10.45.0.80) made adoption flaky on 2026-11-27.
        dns_unifi:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            transport_protocol: udp
            query_name: unifi.qgr1.rabbito.tech
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_not_matches_regexp:
                - ".*\t10\\.45\\.0\\.6$"
              fail_if_matches_regexp:
                - ".*\t10\\.45\\.0\\.80$"
        # Public resolution through fw1 (dnscrypt-proxy upstream).
        dns_public:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            transport_protocol: udp
            query_name: ghcr.io
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp:
                - ".*\tIN\tA\t.*"
