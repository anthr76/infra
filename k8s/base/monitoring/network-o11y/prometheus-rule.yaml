---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qgr1-network
  namespace: monitoring
spec:
  groups:
    - name: qgr1-network
      rules:
        - alert: NetworkDeviceDown
          expr: probe_success{job="qgr1-network-icmp"} == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is not answering ping"
        - alert: InternetUnreachable
          expr: probe_success{job="qgr1-network-icmp", instance="1.1.1.1"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "qgr1 cannot reach the internet through fw1 (WAN down or NAT broken)"
        - alert: ApiServerNameNotResolving
          expr: probe_success{job="qgr1-dns", query="qgr1-k8s.mole-bowfin.ts.net"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "fw1 BIND does not resolve qgr1-k8s.mole-bowfin.ts.net; kubelets will go NotReady"
            description: "Check tailscaled on fw1 and flush with: rndc flushtree mole-bowfin.ts.net"
        - alert: UnifiControllerNameWrong
          expr: probe_success{job="qgr1-dns", query="unifi.qgr1.rabbito.tech"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "unifi.qgr1.rabbito.tech does not resolve to only 10.45.0.6; device adoption/inform may fail"
        - alert: PublicDnsBroken
          expr: probe_success{job="qgr1-dns", query="ghcr.io"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "fw1 cannot resolve public names; image pulls will fail"
        - alert: UnifiInformUnreachable
          expr: probe_success{job="qgr1-network-tcp", instance="10.45.0.6:8080"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "UniFi controller inform endpoint 10.45.0.6:8080 is unreachable"
    # MikroTik switches via mktxp (RouterOS API). Dashboard: Grafana "qgr1 Network / Switches".
    - name: qgr1-switches
      rules:
        - alert: MktxpScrapeFailing
          expr: up{job="mktxp"} == 0 or absent(up{job="mktxp"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus cannot scrape mktxp; switch metrics and switch alerts are blind"
        - alert: MktxpSwitchMissing
          expr: |
            absent(mktxp_system_identity_info{device="sw-core-1"})
            or absent(mktxp_system_identity_info{device="sw-core-2"})
            or absent(mktxp_system_identity_info{device="sw-2"})
            or absent(mktxp_system_identity_info{device="sw-access-1"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "mktxp is not returning data for {{ $labels.device }} (RouterOS API unreachable or switch down)"
        - alert: SwitchUplinkDown
          expr: mktxp_interface_running{device="sw-core-1", name="sfp-sfpplus1"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "sw-core-1 sfp-sfpplus1 (fw1 lan uplink) is down; qgr1 has no gateway"
        - alert: SwitchUplinkDown
          expr: |
            mktxp_interface_running{device="sw-core-1", name=~"bond0|bond1-sw-1"} == 0
            or mktxp_interface_running{device="sw-core-2", name=~"bond0|bond1-sw1-1"} == 0
            or mktxp_interface_running{device="sw-access-1", name="bond-core1"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Inter-switch link {{ $labels.device }} {{ $labels.name }} is not running"
        - alert: SwitchInterfaceErrors
          expr: |
            sum by (device, name) (
              rate(mktxp_interface_rx_error_total[10m]) + rate(mktxp_interface_tx_error_total[10m])
            ) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} {{ $labels.name }} has {{ $value | humanize }} errors/s (bad cable, DAC or optic?)"
        - alert: SwitchPortFlapping
          expr: increase(mktxp_link_downs_total[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} {{ $labels.name }} went down {{ $value | humanize }} times in 15m"
        - alert: PoePoweredNoLink
          expr: |
            (max by (device, name) (mktxp_poe_out_power) > 1)
            and on (device, name) max by (device, name) (mktxp_poe_info{poe_out_status="powered-on"})
            and on (device, name) (max by (device, name) (mktxp_interface_running) == 0)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} {{ $labels.name }} supplies {{ $value }}W PoE but has no link (device powered but not talking: cable pair fault or hung AP)"
        - alert: PoePortFault
          expr: mktxp_poe_info{poe_out_status=~"short-circuit|overload"}
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} {{ $labels.name }} PoE status is {{ $labels.poe_out_status }}"
        - alert: SwitchHighTemperature
          expr: |
            label_replace(mktxp_system_cpu_temperature, "sensor", "cpu", "", "") > 80
            or label_replace(mktxp_system_switch_temperature, "sensor", "switch", "", "") > 65
            or label_replace(mktxp_system_board_temperature1, "sensor", "board1", "", "") > 65
            or label_replace(mktxp_system_board_temperature2, "sensor", "board2", "", "") > 65
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }} {{ $labels.sensor }} temperature is {{ $value }}C"
        # Only sw-core-1 and sw-access-1 report PSU state. sw-access-1 (CRS320) has a
        # single PSU installed; its empty PSU2 slot always reads 0, so it is excluded.
        - alert: SwitchPsuFailed
          expr: |
            label_replace(mktxp_system_psu1_state, "psu", "psu1", "", "") == 0
            or label_replace(mktxp_system_psu2_state{device!="sw-access-1"}, "psu", "psu2", "", "") == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.device }} {{ $labels.psu }} is not OK"
    # APC Smart-UPS 3000 via NUT on fw1 (ScrapeConfig qgr1-ups). Dashboard: Grafana
    # "qgr1 Network / UPS". Host-side policy (snowflake ups/*.nix): workers begin a
    # Ceph-safe shutdown after 3 min on battery, fw1 IPMI-powers-off stragglers at
    # 8 min and powers them back on 2 min after mains returns; fw1 runs until empty.
    # ~33 min runtime at ~16% load (Nov 2026).
    - name: qgr1-ups
      rules:
        - alert: UpsExporterDown
          expr: up{job="qgr1-ups"} == 0 or absent(up{job="qgr1-ups"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cannot scrape the UPS exporter on fw1 (192.168.8.1:9199); power alerts are blind"
            description: "Check prometheus-nut-exporter, upsd and the snmp-ups driver on fw1 (upsc apc@localhost)"
        - alert: UpsMetricsMissing
          expr: |
            count(
              absent(network_ups_tools_battery_charge{job="qgr1-ups"})
              or absent(network_ups_tools_ups_status{job="qgr1-ups", flag="OL"})
              or (max(network_ups_tools_ups_status{job="qgr1-ups", flag=~"OL|OB"}) == 0)
            )
            and on () (max(up{job="qgr1-ups"}) == 1)
          for: 5m
          labels:
            severity: warning
            device: ups
          annotations:
            summary: "UPS exporter is up but NUT has no usable data (UPS NMC unreachable or driver stale)"
        - alert: UpsOnBattery
          expr: |
            network_ups_tools_battery_charge{job="qgr1-ups"}
            and on (instance) (network_ups_tools_ups_status{job="qgr1-ups", flag="OB"} == 1)
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "qgr1 is on UPS battery ({{ $value }}%); workers shut down at 3 min, forced off at 8 min"
        - alert: UpsForcedShutdown
          expr: network_ups_tools_ups_status{job="qgr1-ups", flag="FSD"} == 1
          labels:
            severity: critical
          annotations:
            summary: "UPS forced shutdown (FSD) in progress; workers are powering off"
        - alert: UpsLowBattery
          expr: network_ups_tools_ups_status{job="qgr1-ups", flag="LB"} == 1
          labels:
            severity: critical
          annotations:
            summary: "UPS battery is LOW; fw1 and anything still running will lose power soon"
        - alert: UpsRuntimeLow
          expr: |
            network_ups_tools_battery_runtime{job="qgr1-ups"} < 900
            and on (instance) (network_ups_tools_ups_status{job="qgr1-ups", flag="OB"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "UPS on battery with only {{ $value | humanizeDuration }} runtime left"
        # Fully charged on mains but runtime well below the ~33 min baseline: the
        # battery has aged or load has grown. Charge gate avoids firing while it
        # recharges after an outage.
        - alert: UpsRuntimeDegraded
          expr: |
            network_ups_tools_battery_runtime{job="qgr1-ups"} < 1200
            and on (instance) (network_ups_tools_battery_charge{job="qgr1-ups"} >= 95)
            and on (instance) (network_ups_tools_ups_status{job="qgr1-ups", flag="OL"} == 1)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "UPS full-charge runtime is only {{ $value | humanizeDuration }} (battery aging or load grew)"
        - alert: UpsReplaceBattery
          expr: network_ups_tools_ups_status{job="qgr1-ups", flag="RB"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "UPS says replace battery (battery installed 2024-12-03)"
        - alert: UpsOverload
          expr: |
            network_ups_tools_ups_load{job="qgr1-ups"} > 80
            or (
              network_ups_tools_ups_load{job="qgr1-ups"}
              and on (instance) (network_ups_tools_ups_status{job="qgr1-ups", flag="OVER"} == 1)
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "UPS load is {{ $value | humanize }}%"
        # Transfer points are 97V/136V; warn earlier on sustained brownout/overvoltage.
        # Gated on OL because input reads ~0V while on battery (UpsOnBattery covers that).
        - alert: UpsInputVoltageAbnormal
          expr: |
            (network_ups_tools_input_voltage{job="qgr1-ups"} < 105 or network_ups_tools_input_voltage{job="qgr1-ups"} > 130)
            and on (instance) (network_ups_tools_ups_status{job="qgr1-ups", flag="OL"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "UPS input voltage is {{ $value }}V (normal 105-130V)"
    # fw1 (NixOS router) host exporters on 192.168.8.1: node 9100, BIND 9119,
    # Kea 9547, FRR 9342 (ScrapeConfigs qgr1-fw1-*, router-scrape-config.yaml).
    # node_exporter's interface label is exported_device (device is fw1).
    - name: qgr1-router
      rules:
        - alert: Fw1ExporterDown
          expr: |
            up{job=~"qgr1-fw1-.*"} == 0
            or absent(up{job="qgr1-fw1-node"})
            or absent(up{job="qgr1-fw1-bind"})
            or absent(up{job="qgr1-fw1-kea"})
            or absent(up{job="qgr1-fw1-frr"})
          for: 5m
          labels:
            severity: warning
            device: fw1
            name: "{{ $labels.job }}"
          annotations:
            summary: "Cannot scrape {{ $labels.job }} on fw1; its router alerts are blind"
        - alert: WanDown
          expr: |
            node_network_up{job="qgr1-fw1-node", exported_device="wan"} == 0
            or (
              absent(node_network_route_info{job="qgr1-fw1-node", dest="default", exported_device="wan"})
              and on () (up{job="qgr1-fw1-node"} == 1)
            )
          for: 2m
          labels:
            severity: critical
            device: fw1
            name: wan
          annotations:
            summary: "fw1 WAN is down (link down or no default route from DHCP)"
        - alert: ConntrackNearFull
          expr: |
            node_nf_conntrack_entries{job="qgr1-fw1-node"}
              / node_nf_conntrack_entries_limit{job="qgr1-fw1-node"} > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "fw1 conntrack table is {{ $value | humanizePercentage }} full"
        - alert: ConntrackNearFull
          expr: |
            node_nf_conntrack_entries{job="qgr1-fw1-node"}
              / node_nf_conntrack_entries_limit{job="qgr1-fw1-node"} > 0.95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "fw1 conntrack table is {{ $value | humanizePercentage }} full; new connections are being dropped"
        # Subnet-level series have no pool label; skip tiny pools.
        - alert: DhcpPoolNearlyExhausted
          expr: |
            (
              kea_dhcp4_addresses_assigned_total{job="qgr1-fw1-kea", pool=""}
                / kea_dhcp4_addresses_total{job="qgr1-fw1-kea", pool=""}
            ) > 0.90
            and kea_dhcp4_addresses_total{job="qgr1-fw1-kea", pool=""} >= 10
          for: 15m
          labels:
            severity: warning
            name: "{{ $labels.subnet }}"
          annotations:
            summary: "DHCP pool {{ $labels.subnet }} is {{ $value | humanizePercentage }} used"
        # Peers are the k8s workers; LoadBalancer IPs (10.45.0.0/24) are only
        # reachable through these routes. 0 = down (2 = admin down is ignored).
        - alert: BgpPeerDown
          expr: frr_bgp_peer_state{job="qgr1-fw1-frr"} == 0
          for: 5m
          labels:
            severity: critical
            name: "{{ $labels.peer }}"
          annotations:
            summary: "fw1 BGP session to {{ $labels.peer }} is down; its LB routes are withdrawn"
        - alert: BgpCollectorFailing
          expr: frr_collector_up{job="qgr1-fw1-frr", collector="bgp"} == 0
          for: 5m
          labels:
            severity: warning
            name: frr bgp
          annotations:
            summary: "frr_exporter cannot read BGP state from FRR; BgpPeerDown is blind"
        - alert: BindDown
          expr: bind_up{job="qgr1-fw1-bind"} == 0
          for: 2m
          labels:
            severity: warning
            name: named
          annotations:
            summary: "bind_exporter cannot read BIND stats on fw1 (named down or statistics-channel broken)"
        - alert: DnsServfailHigh
          expr: |
            (
              sum by (device) (rate(bind_response_rcodes_total{job="qgr1-fw1-bind", rcode="SERVFAIL"}[15m]))
                / sum by (device) (rate(bind_response_rcodes_total{job="qgr1-fw1-bind"}[15m]))
            ) > 0.10
            and sum by (device) (rate(bind_response_rcodes_total{job="qgr1-fw1-bind"}[15m])) > 0.05
          for: 15m
          labels:
            severity: warning
            name: named
          annotations:
            summary: "{{ $value | humanizePercentage }} of fw1 DNS answers are SERVFAIL (upstream/DNSSEC trouble?)"
        # Trips at the sensor's own "high" threshold (coretemp 73C, NVMe 84.85C).
        - alert: Fw1HighTemperature
          expr: |
            node_hwmon_temp_celsius{job="qgr1-fw1-node"}
              > node_hwmon_temp_max_celsius{job="qgr1-fw1-node"}
          for: 15m
          labels:
            severity: warning
            name: "{{ $labels.chip }} {{ $labels.sensor }}"
          annotations:
            summary: "fw1 {{ $labels.chip }} {{ $labels.sensor }} is {{ $value }}C"
        - alert: Fw1DiskFull
          expr: |
            node_filesystem_avail_bytes{job="qgr1-fw1-node", mountpoint=~"/|/boot"}
              / node_filesystem_size_bytes{job="qgr1-fw1-node", mountpoint=~"/|/boot"} < 0.10
          for: 15m
          labels:
            severity: warning
            name: "{{ $labels.mountpoint }}"
          annotations:
            summary: "fw1 {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"
