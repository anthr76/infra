---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mktxp-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: mktxp-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.yaml: |
          username: prometheus
          password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: mikrotikPrometheusPassword
