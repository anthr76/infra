# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mktxp
  namespace: monitoring
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      mktxp:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/akpw/mktxp
              tag: 2.1.1@sha256:d041c929d704a47ebf58990950516a5fb5984733bbcfb38010315d02edfa7100
            # mktxp rewrites its config dir with defaults on start, so the
            # ConfigMap is copied into a writable emptyDir first.
            command: ["/bin/sh", "-c"]
            args:
              - cp /config/mktxp.conf /etc/mktxp/mktxp.conf && exec mktxp export
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 49090
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 49090
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: mktxp
        ports:
          http:
            port: 49090
    serviceMonitor:
      app:
        serviceName: mktxp
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 60s
            scrapeTimeout: 30s
    persistence:
      config:
        type: configMap
        name: mktxp-config
        globalMounts:
          - path: /config
            readOnly: true
      etc-mktxp:
        type: emptyDir
        globalMounts:
          - path: /etc/mktxp
      credentials:
        type: secret
        name: mktxp-credentials
        globalMounts:
          - path: /credentials
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
