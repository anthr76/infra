## mktxp RouterOS exporter config for the qgr1 MikroTik switches.
## Credentials come from /credentials/credentials.yaml (ExternalSecret
## mktxp-credentials, Bitwarden key mikrotikPrometheusPassword). The
## `prometheus` user on each switch is in group `monitoring` (policy api,read)
## and may only log in from 192.168.8.0/24 and 10.36.0.0/16.

[sw-core-1]
    hostname = 10.20.99.20
    custom_labels = device:sw-core-1
    poe = False             # no PoE hardware

[sw-core-2]
    hostname = 10.20.99.10
    custom_labels = device:sw-core-2
    poe = False             # no PoE hardware

[sw-2]
    hostname = 10.20.99.15
    custom_labels = device:sw-2
    poe = False             # no PoE hardware

[sw-access-1]
    hostname = 10.20.99.30
    custom_labels = device:sw-access-1

[default]
    enabled = True
    module_only = False
    hostname = localhost
    port = 8728
    credentials_file = /credentials/credentials.yaml

    use_ssl = False
    no_ssl_certificate = False
    ssl_certificate_verify = False
    plaintext_login = True

    # Switch-relevant collectors
    health = True
    installed_packages = True
    interface = True
    routerboard = True
    bridge_vlan = True
    poe = True
    monitor = True
    neighbor = True
    switch_port = True

    # Router-only collectors: nothing to collect on these switches
    dhcp = False
    dhcp_lease = False
    connections = False
    connection_stats = False
    route = False
    pool = False
    firewall = False
    address_list = None
    dns = False
    ipv6_route = False
    ipv6_pool = False
    ipv6_firewall = False
    ipv6_neighbor = False
    ipv6_address_list = None
    netwatch = False
    public_ip = False
    wireless = False
    wireless_clients = False
    capsman = False
    capsman_clients = False
    w60g = False
    eoip = False
    gre = False
    ipip = False
    lte = False
    ipsec = False
    kid_control_assigned = False
    kid_control_dynamic = False
    user = False
    queue = False
    bgp = False
    bfd = False
    routing_stats = False
    certificate = False
    wireguard_peers = False

    use_comments_over_names = False
    check_for_updates = False
