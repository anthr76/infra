---
# Full cluster-admin for the Hermes agent (approved by Anthony). This includes
# read access to all Secrets and the ability to modify RBAC. Changes should still
# go through PRs wherever possible; use direct writes for diagnosis and recovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
