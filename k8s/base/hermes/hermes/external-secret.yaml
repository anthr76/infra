---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-dashboard-signing
  namespace: hermes
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-dashboard-signing
  namespace: hermes
spec:
  refreshInterval: 1h
  refreshPolicy: CreatedOnce
  target:
    name: hermes-dashboard-signing
    template:
      engineVersion: v2
      data:
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-dashboard-signing
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: hermes
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .hermesDashboardPassword }}"
        OPENROUTER_API_KEY: "{{ .hermesOpenrouterApiKey }}"
  data:
    - secretKey: hermesDashboardPassword
      remoteRef:
        key: hermesDashboardPassword
    - secretKey: hermesOpenrouterApiKey
      remoteRef:
        key: hermesOpenrouterApiKey
