---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: hermes
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        OPENROUTER_API_KEY: "{{ .hermesOpenrouterApiKey }}"
        TELEGRAM_ALLOWED_USERS: "{{ .hermesTelegramAllowedUsers }}"
        TELEGRAM_BOT_TOKEN: "{{ .hermesTelegramBotToken }}"
  data:
    - secretKey: hermesOpenrouterApiKey
      remoteRef:
        key: hermesOpenrouterApiKey
    - secretKey: hermesTelegramAllowedUsers
      remoteRef:
        key: hermesTelegramAllowedUsers
    - secretKey: hermesTelegramBotToken
      remoteRef:
        key: hermesTelegramBotToken
