---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: searxng
  namespace: hermes
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng
  namespace: hermes
spec:
  refreshInterval: 1h
  refreshPolicy: CreatedOnce
  target:
    name: searxng
    template:
      engineVersion: v2
      data:
        secret-key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: searxng
