---
# All credentials are generated in-cluster once (CreatedOnce) and never stored
# in Git. Generated passwords are alphanumeric (symbols: 0) so they are safe to
# embed in the postgresql:// / redis:// / amqp:// URLs templated below.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: firecrawl-postgres
  namespace: hermes
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-postgres
  namespace: hermes
spec:
  refreshInterval: 1h
  refreshPolicy: CreatedOnce
  target:
    name: firecrawl-postgres
    template:
      engineVersion: v2
      data:
        # pg_cron in the nuq-postgres image is bound to database "postgres".
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres
        POSTGRES_PASSWORD: "{{ .password }}"
        NUQ_DATABASE_URL: "postgresql://postgres:{{ .password }}@firecrawl-nuq-postgres:5432/postgres"
        NUQ_DATABASE_URL_LISTEN: "postgresql://postgres:{{ .password }}@firecrawl-nuq-postgres:5432/postgres"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: firecrawl-postgres
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: firecrawl-redis
  namespace: hermes
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-redis
  namespace: hermes
spec:
  refreshInterval: 1h
  refreshPolicy: CreatedOnce
  target:
    name: firecrawl-redis
    template:
      engineVersion: v2
      data:
        REDIS_PASSWORD: "{{ .password }}"
        REDIS_URL: "redis://:{{ .password }}@firecrawl-redis:6379"
        REDIS_RATE_LIMIT_URL: "redis://:{{ .password }}@firecrawl-redis:6379"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: firecrawl-redis
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: firecrawl-rabbitmq
  namespace: hermes
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-rabbitmq
  namespace: hermes
spec:
  refreshInterval: 1h
  refreshPolicy: CreatedOnce
  target:
    name: firecrawl-rabbitmq
    template:
      engineVersion: v2
      data:
        RABBITMQ_DEFAULT_USER: firecrawl
        RABBITMQ_DEFAULT_PASS: "{{ .password }}"
        NUQ_RABBITMQ_URL: "amqp://firecrawl:{{ .password }}@firecrawl-rabbitmq:5672"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: firecrawl-rabbitmq
---
# Admin-queue key (BULL_AUTH_KEY). Without it the upstream default is a
# well-known value, so always generate one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: firecrawl-api
  namespace: hermes
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-api
  namespace: hermes
spec:
  refreshInterval: 1h
  refreshPolicy: CreatedOnce
  target:
    name: firecrawl-api
    template:
      engineVersion: v2
      data:
        BULL_AUTH_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: firecrawl-api
