apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default
  namespace: tailscale
spec:
  tailscale:
    acceptRoutes: true
  statefulSet:
    pod:
      tailscaleContainer:
        # ts-qgr1 (fronting the qgr1 kube-apiserver) uses ~165Mi.
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 384Mi
