---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: rook-ceph
      version: v1.20.1
      sourceRef:
        kind: HelmRepository
        name: rook-ceph-charts
        namespace: flux-system
  values:
    crds:
      enabled: true
    monitoring:
      enabled: true
    # Adds bucketPolicy to the default-allowed "maxObjects,maxSize" so an OBC can
    # declare its own bucket policy -- used by chronoframe to grant anonymous
    # GetObject on its photos/ prefix for Cloudflare edge caching.
    obcAllowAdditionalConfigFields: "maxObjects,maxSize,bucketPolicy"
