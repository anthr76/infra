---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: v1.20.8
      sourceRef:
        kind: HelmRepository
        name: rook-ceph-charts
        namespace: flux-system
  dependsOn:
    - name: rook-ceph
  # A Ceph upgrade takes far longer than a Helm timeout, and Rook reconciles the
  # CephCluster on its own. Do not wait on it: a timed-out wait makes Flux roll
  # the chart back, which flips cephVersion.image back mid-upgrade.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  rollback:
    disableWait: true
  values:
    toolbox:
      enabled: false
    monitoring:
      enabled: true
    cephClusterSpec:
      security:
        cephx:
          # CVE-2025-30156: rotate core daemon keys (mon, mgr, osd, mds, rgw,
          # nfs) to the AES256K key type. Bump keyGeneration to rotate again.
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # Kernel mounts need Linux 7.0+ for AES256K; nodes run 6.18.
          csi:
            keyType: aes
      healthCheck:
        # Warnings that cannot clear while CSI keys stay on AES. Switch to
        # `unmute` once every key is AES256K.
        muteHealthWarning:
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: ceph-block
      isDefault: true
      deletionPolicy: Delete
    cephBlockPools:
      - name: fast-ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
          deviceClass: ssd
        storageClass:
          enabled: true
          name: fast-ceph-block
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          mountOptions: []
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      - name: builtin-mgr
        spec:
          name: .mgr
          failureDomain: host
          replicated:
            size: 3
            requireSafeReplicaSize: true
          deviceClass: ssd
          enableCrushUpdates: true
          parameters:
            compression_mode: none
        storageClass:
          enabled: false
      - name: builtin-nfs
        spec:
          name: .nfs
          failureDomain: host
          replicated:
            size: 3
            requireSafeReplicaSize: true
          deviceClass: ssd
          enableCrushUpdates: true
        storageClass:
          enabled: false
      - name: slow-ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 2
            # requireSafeReplicaSize: false
          deviceClass: hdd
          enableCrushUpdates: true
        storageClass:
          enabled: true
          name: slow-ceph-block
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          mountOptions: []
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystems:
      - name: fast-ceph-filesystem
        spec:
          metadataPool:
            deviceClass: ssd
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: fast-data0
              deviceClass: ssd
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          isDefault: false
          name: fast-ceph-filesystem
          pool: fast-data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          mountOptions: []
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      - name: slow-ceph-filesystem
        spec:
          metadataPool:
            deviceClass: ssd
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 2
              name: slow-data0
              deviceClass: hdd
              enableCrushUpdates: true
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          isDefault: false
          name: slow-ceph-filesystem
          pool: slow-data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          mountOptions: []
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephObjectStores:
      - name: slow-ceph-objectstore
        spec:
          metadataPool:
            deviceClass: ssd
            failureDomain: host
            replicated:
              size: 2
          dataPool:
            failureDomain: osd
            deviceClass: hdd
            erasureCoded:
              dataChunks: 2
              codingChunks: 1
          preservePoolsOnDelete: false
          gateway:
            port: 80
            hostNetwork: false
            resources:
              limits:
                cpu: "2000m"
                memory: "2Gi"
              requests:
                cpu: "1000m"
                memory: "1Gi"
            instances: 1
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          name: slow-ceph-bucket
          reclaimPolicy: Delete
          parameters:
            region: us-east-1
    route:
      dashboard:
        host:
          name: "rook.qgr1.rabbito.tech"
          path: "/"
          pathType: PathPrefix
        parentRefs:
          - name: cilium-internal
            namespace: kube-system
            sectionName: https
