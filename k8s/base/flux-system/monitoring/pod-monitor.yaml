---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: Exists
  podMetricsEndpoints:
    # No honorLabels: the Flux dashboards expect `namespace` to be the controller's
    # namespace and the object's namespace to arrive as `exported_namespace`.
    - port: http-prom
