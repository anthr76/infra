---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux
  namespace: flux-system
spec:
  groups:
    - name: flux
      rules:
        - alert: FluxComponentAbsent
          annotations:
            description: Flux component has disappeared from Prometheus target discovery.
            summary: Flux component is down.
          expr: |
            absent(up{job=~".*flux-system.*"} == 1)
          for: 15m
          labels:
            severity: critical
        - alert: FluxReconciliationFailure
          annotations:
            description:
              "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} reconciliation has been failing
              for more than ten minutes."
            summary: Flux reconciliation failure.
          expr: |
            max by (exported_namespace, name, customresource_kind) (gotk_resource_info{ready="False", suspended!="true"}) == 1
          for: 15m
          labels:
            severity: critical
