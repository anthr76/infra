---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 15m
  chart:
    spec:
      chart: flux-operator
      version: 0.61.0
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
      interval: 15m
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Refresh FluxReport and the flux_resource_info metrics every 30s instead of
    # 5m, as the Flux Operator docs recommend when scraping its metrics.
    reporting:
      interval: 30s
    serviceMonitor:
      create: true
