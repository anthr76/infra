---
# Blocked until a dedicated SSH public key is authorized on rsync.net and the
# matching private key is stored in Bitwarden as rsyncNetKopiurSshPrivateKey.
# The existing VolSync Secret and password authentication are left untouched.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: kopiur-sftp-creds
spec:
  externalSecretName: kopiur-sftp-creds
  namespaceSelectors:
    - matchLabels:
        volsync.kutara.io/enabled: "true"
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: bitwarden
      kind: ClusterSecretStore
    target:
      name: kopiur-sftp-creds
      creationPolicy: Owner
      template:
        type: Opaque
        data:
          KOPIA_SFTP_KEY_DATA: "{{ .sftpKey }}"
          KOPIA_SFTP_KNOWN_HOSTS: "{{ .knownHosts }}"
          KOPIA_PASSWORD: "{{ .kopiaPassword }}"
    data:
      - secretKey: sftpKey
        remoteRef:
          key: rsyncNetKopiurSshPrivateKey
      - secretKey: knownHosts
        remoteRef:
          key: rsyncNetKnownHosts
      - secretKey: kopiaPassword
        remoteRef:
          key: kopiaPassword
