---
# Flux substitutes only the connection coordinates, never the Kopia password or SSH key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-coordinates
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: kopiur-coordinates
    creationPolicy: Owner
  data:
    - secretKey: RSYNC_NET_HOST
      remoteRef:
        key: rsyncNetHost
    - secretKey: RSYNC_NET_USER
      remoteRef:
        key: rsyncNetUser
