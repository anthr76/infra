---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  namespace: kopiur-system
spec:
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kopiur
      version: "0.10.16"
      sourceRef:
        kind: HelmRepository
        name: kopiur-charts
        namespace: flux-system
  values:
    installScope: cluster
