---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: descheduler
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: descheduler
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: descheduler-charts
        namespace: flux-system
  values:
    kind: CronJob
    schedule: "*/15 * * * *"
    ttlSecondsAfterFinished: 600

    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 256Mi

    deschedulerPolicyAPIVersion: "descheduler/v1alpha2"
    deschedulerPolicy:
      maxNoOfPodsToEvictPerNode: 2
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                # A pod that was just moved is left alone for 6h, which bounds
                # any back-and-forth between nodes.
                minPodAge: 6h
                podProtections:
                  defaultDisabled:
                    - "PodsWithLocalStorage"
            - name: RemoveDuplicates
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                constraints:
                  - DoNotSchedule
                  - ScheduleAnyway
            - name: LowNodeUtilization
              args:
                # Memory only. CPU requests on the Ceph-heavy nodes are
                # pinned by system-critical pods and would never drop.
                thresholds:
                  memory: 55
                targetThresholds:
                  memory: 80
            - name: RemoveFailedPods
              args:
                reasons:
                  - OutOfcpu
                  - CreateContainerConfigError
                  - CrashLoopBackOff
                includingInitContainers: true
                excludeOwnerKinds:
                  - Job
                minPodLifetimeSeconds: 600
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 100
                includingInitContainers: true
          plugins:
            balance:
              enabled:
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsViolatingNodeTaints
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingInterPodAntiAffinity
                - RemoveFailedPods
                - RemovePodsHavingTooManyRestarts
