---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 15m
  chart:
    spec:
      chart: external-secrets
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 15m
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # ServiceMonitors for the controller, webhook and cert-controller. The chart
    # skips them where the Prometheus Operator CRDs are missing (civo-mgmt-0).
    serviceMonitor:
      enabled: true
      renderMode: skipIfMissing
    # Working set on qgr1 / civo-mgmt-0: controller 65/43Mi, webhook 48/39Mi,
    # cert-controller 81/54Mi, bitwarden-sdk-server 18/303Mi.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 160Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    bitwarden-sdk-server:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
      # The SDK server only reads its TLS certificate at startup, so restart it
      # when cert-manager renews bitwarden-tls-certs.
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      tls:
        enabled: true
        secretName: bitwarden-tls-certs
