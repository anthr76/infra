---
apiVersion: kamaji.clastix.io/v1alpha1
kind: TenantControlPlane
metadata:
  name: qgr1
  namespace: tenant-cluster-qgr1
  labels:
    tenant.clastix.io: qgr1
spec:
  dataStore: default
  controlPlane:
    deployment:
      replicas: 2
      additionalMetadata:
        labels:
          tenant.clastix.io: qgr1
      # Prefer, never require, the large nodes: a kube-apiserver can use up
      # to 3Gi, more than a g4s.kube.medium can hold, but a hard pin would
      # leave the control plane unschedulable if the node sizes change.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["g4s.kube.large"]
      # Kamaji defaults to maxSurge 100% (blue/green), which runs six
      # kube-apiservers during a rollout and got one evicted for node memory
      # pressure on civo-mgmt-0. Replace pods one at a time instead.
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      # One control-plane pod per node, so a node loss takes out one replica
      # and two kube-apiservers never compete for one node's memory.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              kamaji.clastix.io/name: qgr1
              kamaji.clastix.io/component: deployment
      extraArgs:
        apiServer:
          - --advertise-address=100.94.68.123
          - --runtime-config=admissionregistration.k8s.io/v1beta1=true
          - --feature-gates=MutatingAdmissionPolicy=true
        controllerManager: []
        scheduler: []
      # Memory sized from observed usage on civo-mgmt-0 (Nov 2026):
      # kube-apiserver 1.7Gi fresh, ~3.0Gi daily peak; controller-manager
      # ~260Mi as leader; scheduler ~65Mi. GOMEMLIMIT is injected at 90% of
      # each limit (kamaji-system/gomemlimit-policy.yaml). The apiserver
      # request is below its limit on purpose: 3x3Gi requested would commit
      # ~96% of the node pool's allocatable memory.
      resources:
        apiServer:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 3Gi
        controllerManager:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        scheduler:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
    service:
      additionalMetadata:
        labels:
          tenant.clastix.io: qgr1
        annotations:
          tailscale.com/hostname: qgr1-k8s
          tailscale.com/expose: "true"
          tailscale.com/proxy-class: "default"
      serviceType: ClusterIP
  kubernetes:
    version: v1.36.2
    kubelet:
      cgroupfs: systemd
      preferredAddressTypes:
        - InternalIP
        - Hostname
        - ExternalIP
    admissionControllers:
      - ResourceQuota
      - LimitRanger
  networkProfile:
    address: 100.94.68.123
    port: 6443
    certSANs:
      - qgr1.cluster.local
      - qgr1-k8s.mole-bowfin.ts.net
      - 100.94.68.123
    serviceCidrs:
      - 10.96.0.0/16
    podCidrs:
      - 10.36.0.0/16
    dnsServiceIPs:
      - 10.96.0.10
  addons:
    coreDNS: {}
    konnectivity:
      server:
        port: 8132
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      agent:
        #version: "v0.36.0"
        mode: DaemonSet
        extraArgs:
          - --proxy-server-host=100.94.68.123
