---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chronoframe
  namespace: chronoframe
  labels:
    component.kutara.io/part-of: standard-helm-release
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      chronoframe:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hoshinosuzumi/chronoframe
              tag: 1.0.0-rc.4@sha256:2edf0ef29d3db8a9493736c9b970d4880ddbce394e6bd22f85331b6e56c4b859
            env:
              TZ: America/New_York
              NITRO_PORT: "3000"
              NITRO_HOST: 0.0.0.0

              # Photos live in the rook-ceph bucket provisioned by the OBC. RGW has no
              # virtual-host DNS configured, so path-style addressing is required.
              #
              # This must be the PUBLIC endpoint, not the cluster service: the browser
              # uploads straight to a presigned S3 URL derived from it. The hostAliases
              # entry below keeps the pod's own S3 traffic inside the cluster.
              NUXT_STORAGE_PROVIDER: s3
              NUXT_PROVIDER_S3_ENDPOINT: https://object.kutara.io
              NUXT_PROVIDER_S3_BUCKET: chronoframe-photos
              NUXT_PROVIDER_S3_REGION: us-east-1
              NUXT_PROVIDER_S3_PREFIX: photos/
              NUXT_PROVIDER_S3_FORCE_PATH_STYLE: "true"
              # Browsers fetch objects from here, not through the pod, so Cloudflare
              # caches images at the edge. Served by the ceph-rgw-cdn HTTPRoute.
              NUXT_PROVIDER_S3_CDN_URL: https://cdn.kutara.io

              NUXT_PUBLIC_APP_TITLE: Gallery
              NUXT_PUBLIC_APP_AUTHOR: Anthony Rabbito
              CFRAME_ADMIN_EMAIL: ted437@gmail.com
              CFRAME_ADMIN_NAME: Anthony

              NUXT_PROVIDER_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: chronoframe-photos
                    key: AWS_ACCESS_KEY_ID
              NUXT_PROVIDER_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: chronoframe-photos
                    key: AWS_SECRET_ACCESS_KEY
            envFrom:
              - secretRef:
                  name: chronoframe
            # The image pipeline is CPU-bound and blocks Node's event loop: 5 hardcoded
            # workers (server/plugins/4.pipeline-queue.ts) decoding 20MB HEICs will stall
            # HTTP responses for tens of seconds. Probes must tolerate that, or kubelet
            # restarts the pod mid-batch and every in-flight upload fails.
            probes:
              # Deliberately slack: only catches a truly wedged process (~5min), never a
              # merely busy one. Restarting a busy pod destroys queued work.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 10
              # Keeps the pod attached to the gateway during processing bursts; dropping
              # out is what surfaced as 503 "no healthy upstream" while polling task status.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 0
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                # 50m starved the image pipeline under node contention. No CPU limit:
                # throttling a blocked event loop is what trips the probes.
                cpu: 500m
                memory: 1Gi
              limits:
                # 5 concurrent HEIC decodes of ~20MB originals plus ThumbHash generation
                memory: 6Gi
        pod:
          # Keep the pod's own S3 traffic in-cluster instead of hairpinning out to
          # Cloudflare and back. The cilium-external gateway serves the *.kutara.io
          # wildcard cert, so TLS still validates against this address.
          hostAliases:
            - ip: 10.45.0.43
              hostnames:
                - object.kutara.io
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

    service:
      app:
        controller: chronoframe
        ports:
          http:
            port: 3000

    route:
      app:
        parentRefs:
          - name: cilium-external
            namespace: kube-system
        hostnames:
          - gallery.kutara.io

    persistence:
      data:
        existingClaim: chronoframe-data-v1
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
