---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: chronoframe-session-password
  namespace: chronoframe
spec:
  # NUXT_SESSION_PASSWORD must be exactly 32 characters. Symbols are omitted so the
  # value survives env-var interpolation unambiguously.
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: chronoframe-og-image-secret
  namespace: chronoframe
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: chronoframe-admin-password
  namespace: chronoframe
spec:
  length: 24
  digits: 6
  symbols: 4
  symbolCharacters: "$@!"
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chronoframe
  namespace: chronoframe
spec:
  refreshInterval: 1h
  # CreatedOnce: never regenerate. Rotating the session password would invalidate every
  # login, and rotating the admin password would silently lock the account out.
  refreshPolicy: CreatedOnce
  target:
    name: chronoframe
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NUXT_SESSION_PASSWORD: "{{ .sessionPassword }}"
        NUXT_OG_IMAGE_SECRET: "{{ .ogImageSecret }}"
        CFRAME_ADMIN_PASSWORD: "{{ .adminPassword }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: chronoframe-session-password
      rewrite:
        - regexp:
            source: "^password$"
            target: "sessionPassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: chronoframe-og-image-secret
      rewrite:
        - regexp:
            source: "^password$"
            target: "ogImageSecret"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: chronoframe-admin-password
      rewrite:
        - regexp:
            source: "^password$"
            target: "adminPassword"
