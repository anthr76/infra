---
# scuttle on each worker takes this Lease (kube-system/scuttle-drain) before
# draining, so only one node drains at a time cluster-wide (snowflake
# modules/nixos/scuttle.nix, drainLock). It authenticates with the kubelet's
# own credentials (group system:nodes). NodeRestriction only guards Leases in
# kube-node-lease, so this Role is all that is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scuttle-drain-lock
  namespace: kube-system
rules:
  # create cannot be limited by resourceNames; the Lease name is fixed by the client.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["scuttle-drain"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scuttle-drain-lock
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scuttle-drain-lock
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:nodes
