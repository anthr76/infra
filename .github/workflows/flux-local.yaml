---
name: Flux Local

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flux Local - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
      clusters: ${{ steps.clusters.outputs.clusters }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: k8s/clusters

      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          # Also run when this workflow changes, so CI changes get exercised.
          patterns: |
            k8s/**/*
            .github/workflows/flux-local.yaml

      - name: Generate Cluster Matrix
        id: clusters
        run: |
          clusters=$(ls -d k8s/clusters/*/ | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "clusters=$clusters" >> $GITHUB_OUTPUT

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: ${{ fromJson(needs.filter.outputs.clusters) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # flux-local only reads this repo. Kustomizations and HelmReleases sourced
      # from any other GitRepository (e.g. kamaji's chart, the Gateway API CRDs)
      # would fail, so clone every GitRepository declared under k8s/ at the ref
      # Flux uses and map each one in with --sources NAME=PATH.
      - name: Fetch GitRepository sources
        id: sources
        run: |
          sources="flux-system"
          mkdir -p .flux-local-sources
          # '|' rather than a tab: bash collapses consecutive whitespace IFS
          # characters, which would shift empty fields.
          while IFS='|' read -r name url tag branch commit semver; do
            dir=".flux-local-sources/${name}"
            [ -e "$dir" ] && continue
            case "$url" in
              https://*) ;;
              *) echo "::warning::GitRepository ${name}: skipping non-HTTPS URL ${url}"; continue ;;
            esac
            if [ -n "$commit" ]; then
              git init -q "$dir"
              git -C "$dir" fetch -q --depth 1 "$url" "$commit"
              git -C "$dir" checkout -q FETCH_HEAD
            else
              [ -n "$semver" ] && echo "::warning::GitRepository ${name}: semver ref ${semver} unsupported, using ${tag:-${branch:-default branch}}"
              ref="${tag:-$branch}"
              git clone -q --depth 1 --filter=blob:none ${ref:+--branch "$ref"} "$url" "$dir"
            fi
            echo "Fetched GitRepository ${name} (${url} ${commit:-${tag:-${branch:-HEAD}}})"
            sources="${sources},${name}=${dir}"
          done < <(grep -rlZ --include='*.yaml' 'kind: GitRepository' k8s \
            | xargs -0 yq ea -N '
                select(.kind == "GitRepository" and .metadata.name != "flux-system")
                | [.metadata.name, .spec.url, .spec.ref.tag // "", .spec.ref.branch // "",
                   .spec.ref.commit // "", .spec.ref.semver // ""]
                | join("|")')
          echo "sources=${sources}" >> "$GITHUB_OUTPUT"

      # flux-local builds Kustomizations in parallel, and two of ours have paths
      # nested inside another Kustomization's directory, which occasionally races
      # ("kustomization.yaml is empty"). Retry before failing.
      - name: Run flux-local test
        run: |
          for attempt in 1 2 3; do
            if docker run --rm \
              -v "${{ github.workspace }}:/github/workspace" \
              -w /github/workspace \
              ghcr.io/allenporter/flux-local:v8.0.1 \
              test \
              --all-namespaces \
              --enable-helm \
              --skip-invalid-helm-release-paths \
              --sources "${{ steps.sources.outputs.sources }}" \
              --path /github/workspace/k8s/clusters/${{ matrix.cluster }}; then
              exit 0
            fi
            echo "::warning::flux-local test failed (attempt ${attempt}/3)"
            sleep 5
          done
          echo "::error::flux-local test failed after 3 attempts"
          exit 1

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        cluster: ${{ fromJson(needs.filter.outputs.clusters) }}
        resource: ["helmrelease", "kustomization"]
      fail-fast: false
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: default
          persist-credentials: false
          ref: "${{ github.event.repository.default_branch }}"

      - name: Run flux-local diff
        run: |
          for attempt in 1 2 3; do
            rm -f diff.patch
            if docker run --rm \
              -v "${{ github.workspace }}:/github/workspace" \
              -w /github/workspace \
              ghcr.io/allenporter/flux-local:v8.0.1 \
              diff ${{ matrix.resource }} \
              --unified 6 \
              --path /github/workspace/pull/k8s/clusters/${{ matrix.cluster }} \
              --path-orig /github/workspace/default/k8s/clusters/${{ matrix.cluster }} \
              --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart" \
              --limit-bytes 10000 \
              --all-namespaces \
              --sources "flux-system" \
              --output-file diff.patch && [ -f diff.patch ]; then
              exit 0
            fi
            echo "::warning::flux-local diff failed (attempt ${attempt}/3)"
            sleep 5
          done
          echo "::error::flux-local diff failed after 3 attempts"
          exit 1

      # Write the comment body to a file: passing a large diff through step
      # outputs/inputs hits "Argument list too long", and GitHub caps comments
      # at 65536 characters.
      - name: Generate Comment
        id: comment
        run: |
          if [ ! -s diff.patch ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          limit=60000
          {
            echo "## ${{ matrix.cluster }} - ${{ matrix.resource }}"
            echo '```diff'
            head -c "$limit" diff.patch
            echo '```'
            if [ "$(wc -c < diff.patch)" -gt "$limit" ]; then
              echo
              echo "_Diff truncated to ${limit} bytes; see the workflow logs for the full output._"
            fi
          } > comment.md
          cat diff.patch
          echo "has_diff=true" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.comment.outputs.has_diff == 'true' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.cluster }}/${{ matrix.resource }}
          path: comment.md
